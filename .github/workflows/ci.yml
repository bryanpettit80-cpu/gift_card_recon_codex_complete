name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up lock generator
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.3"
          enable-cache: false
      - name: Verify dependency lock
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        working-directory: _program
        run: |
          uv pip compile pyproject.toml requirements-bootstrap.in --all-extras --universal --python-version 3.10 --generate-hashes --output-file requirements.lock
          git diff --exit-code -- requirements.lock
      - name: Set up Linux development environment
        if: runner.os != 'Windows'
        run: bash _program/setup_development.sh
      - name: Run tests
        if: runner.os != 'Windows'
        working-directory: _program
        run: |
          ../.venv/bin/python -m pytest -q \
            --ignore=tests/test_actual_files_if_present.py \
            --ignore=tests/test_windows_pdf_integration.py
      - name: Run tests through guarded Windows runtime (Excel unavailable)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\_program\run_tests.ps1 -SkipExcelIntegration
