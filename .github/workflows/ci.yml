name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up lock generator
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: false
      - name: Verify dependency lock
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        working-directory: _program
        run: |
          uv pip compile pyproject.toml requirements-bootstrap.in --all-extras --universal --python-version 3.10 --generate-hashes --output-file requirements.lock
          git diff --exit-code -- requirements.lock
      - name: Install locked dependencies
        working-directory: _program
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Install editable package
        working-directory: _program
        run: python -m pip install --no-build-isolation --no-deps -e ".[dev]"
      - name: Check installed dependencies
        working-directory: _program
        run: python -m pip check
      - name: Run tests
        if: runner.os != 'Windows'
        working-directory: _program
        run: python -m pytest -q
      - name: Run tests through guarded Windows runtime (Excel unavailable)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\_program\run_tests.ps1 -SkipExcelIntegration
